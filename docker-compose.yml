services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: campussafe
      POSTGRES_USER: campussafe
      POSTGRES_PASSWORD: campussafe
    ports:
      - "5432:5432"
    volumes:
      - campussafe_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campussafe -d campussafe"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  campussafe_db:
